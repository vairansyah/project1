        }
        .card p {
            font-size: 10px;
        }
        media (max-width: 480px) {
            nav {
                padding: 12px 15px;
            }
            nav h2 {
                font-size: 17px;
            }
            nav ul {
                gap: 12px;
            }
            nav ul li a {
                font-size: 10px;
            }
            .container {
                gap: 20px;
            }
            .card {
                width: 90px;

            }
        }

</head>
